name: Build KernelSU Next - POCO X3 NFC

on:
  workflow_dispatch:
  push:
    branches:
      - rethinking

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      DATE: ${{ steps.setdate.outputs.DATE }}
    steps:
      - name: Set build date
        id: setdate
        run: |
          echo "DATE=$(TZ=Asia/Kuala_Lumpur date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  build_kernel:
    name: Build KernelSU Next
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout Fork Source
        uses: actions/checkout@v4
        with:
          ref: rethinking
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev \
            device-tree-compiler \
            python3 zip wget curl git \
            cpio rsync

      - name: Integrate Official KernelSU Next
        shell: bash
        run: |
          set -e

          echo "Removing old KernelSU source..."
          rm -rf drivers/kernelsu
          rm -rf KernelSU-Next

          echo "Installing KernelSU Next legacy..."
          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          echo "Checking KernelSU integration..."
          test -L drivers/kernelsu
          test -d KernelSU-Next/kernel
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          grep -qE '^[[:space:]]*config[[:space:]]+KSU([[:space:]]|$)' drivers/kernelsu/Kconfig

          grep -q 'kernelsu' drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig

          echo "KernelSU Next integration successful."

      - name: Configure KernelSU Next
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          path = "arch/arm64/configs/surya_defconfig"

          configs = {
              "CONFIG_KSU": "y",
              "CONFIG_KPROBES": "y",
              "CONFIG_KPROBE_EVENTS": "y",
              "CONFIG_KSU_KPROBE_HOOKS": "y",
          }

          with open(path, "r") as f:
              lines = f.read().splitlines()

          for key, value in configs.items():
              lines = [
                  line for line in lines
                  if not line.startswith(key + "=")
                  and line != "# " + key + " is not set"
              ]
              lines.append(f"{key}={value}")

          with open(path, "w") as f:
              f.write("\n".join(lines) + "\n")

          print("KernelSU Next configuration:")
          for key, value in configs.items():
              print(f"{key}={value}")
          PY

      - name: Verify Configuration
        shell: bash
        run: |
          set -e
          grep -E \
            'CONFIG_KSU=|CONFIG_KPROBES=|CONFIG_KPROBE_EVENTS=|CONFIG_KSU_KPROBE_HOOKS=' \
            arch/arm64/configs/surya_defconfig

      - name: Build Kernel
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/artifact"
          chmod +x build.sh

          ./build.sh \
            KSU \
            "${{ needs.prepare.outputs.DATE }}" \
            "$GITHUB_WORKSPACE/artifact"

      - name: Check Kernel ZIP
        run: |
          set -e
          ls -lh artifact/
          test -n "$(find artifact -maxdepth 1 -name '*.zip' -print -quit)"

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: POCO-X3-NFC-KernelSU-Next-${{ needs.prepare.outputs.DATE }}
          path: artifact/*.zip
          if-no-files-found: error
          retention-days: 7
