name: Build KernelSU Next - POCO X3 NFC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      DATE: ${{ steps.setdate.outputs.DATE }}
    steps:
      - name: Set build date (Malaysia)
        id: setdate
        shell: bash
        run: |
          echo "DATE=$(TZ=Asia/Kuala_Lumpur date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

  build_kernel:
    name: Build KernelSU Next
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 180

    steps:
      - name: Checkout rethinking branch
        uses: actions/checkout@v4
        with:
          ref: rethinking
          fetch-depth: 0

      - name: Verify required source files
        shell: bash
        run: |
          set -euo pipefail
          test -f build.sh
          test -f arch/arm64/configs/surya_defconfig
          test -f drivers/Kconfig
          test -f drivers/Makefile
          echo "Required kernel source files found."

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler lz4 \
            python3 zip wget curl git cpio rsync

      - name: Integrate KernelSU Next (legacy)
        shell: bash
        run: |
          set -euo pipefail

          # Remove the previous in-tree integration from this clean checkout,
          # then install the official KernelSU Next legacy integration.
          rm -rf drivers/kernelsu KernelSU-Next

          curl -fLSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          test -e drivers/kernelsu
          test -d KernelSU-Next/kernel
          test -f drivers/kernelsu/Kconfig
          test -f drivers/kernelsu/Makefile

          grep -qE '^[[:space:]]*config[[:space:]]+KSU([[:space:]]|$)' drivers/kernelsu/Kconfig
          grep -qE '^[[:space:]]*config[[:space:]]+KSU_MANUAL_HOOK([[:space:]]|$)' drivers/kernelsu/Kconfig
          grep -qE '^[[:space:]]*config[[:space:]]+KSU_KPROBES_HOOK([[:space:]]|$)' drivers/kernelsu/Kconfig
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig
          grep -q 'kernelsu' drivers/Makefile

          echo "KernelSU Next legacy integration and hook symbols verified."

      - name: Configure KernelSU Next Manual Hook
        shell: bash
        run: |
          set -euo pipefail
          DEFCONFIG="arch/arm64/configs/surya_defconfig"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("arch/arm64/configs/surya_defconfig")
          lines = path.read_text().splitlines()

          # Remove existing active or disabled entries so each symbol appears once.
          keys = {
              "CONFIG_KSU",
              "CONFIG_KSU_MANUAL_HOOK",
              "CONFIG_KSU_KPROBES_HOOK",
          }
          lines = [
              line for line in lines
              if not any(
                  line.startswith(key + "=") or line == f"# {key} is not set"
                  for key in keys
              )
          ]

          lines.extend([
              "CONFIG_KSU=y",
              "CONFIG_KSU_MANUAL_HOOK=y",
              "# CONFIG_KSU_KPROBES_HOOK is not set",
          ])
          path.write_text("\n".join(lines) + "\n")
          print("Manual Hook settings written to surya_defconfig.")
          PY

          echo "Checking selected defconfig entries:"
          grep -E '^(CONFIG_KSU=|CONFIG_KSU_MANUAL_HOOK=|# CONFIG_KSU_KPROBES_HOOK is not set)' "$DEFCONFIG"

          # Ensure the two alternative hook methods are not both selected.
          test "$(grep -c '^CONFIG_KSU_MANUAL_HOOK=y$' "$DEFCONFIG")" -eq 1
          ! grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' "$DEFCONFIG"

      - name: Build kernel and package AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifact"
          chmod +x build.sh

          ./build.sh \
            KSU \
            "${{ needs.prepare.outputs.DATE }}" \
            "$GITHUB_WORKSPACE/artifact"

      - name: Verify kernel ZIP
        shell: bash
        run: |
          set -euo pipefail
          find artifact -maxdepth 1 -type f -name '*.zip' -print
          ZIP_FILE="$(find artifact -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          test -s "$ZIP_FILE"
          ls -lh "$ZIP_FILE"

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: POCO-X3-NFC-KernelSU-Next-${{ needs.prepare.outputs.DATE }}
          path: artifact/*.zip
          if-no-files-found: error
          retention-days: 7
